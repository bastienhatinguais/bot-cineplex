name: Check Odyssey seats

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 10 minutes (min GitHub = 5, souvent retarde)
  workflow_dispatch: {}       # lancement manuel pour tester

permissions:
  contents: write

concurrency:
  group: check-seats
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check seats
        env:
          PUSHBULLET_TOKEN: ${{ secrets.PUSHBULLET_TOKEN }}
        run: python check_seats.py

      - name: Commit state
        run: |
          git config user.name "seat-bot"
          git config user.email "seat-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update seat state [skip ci]"
          git push
